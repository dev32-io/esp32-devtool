[project]
name = "esp32-devtool"
version = "0.1.0"
description = "ADB-style CLI for ESP32/ESP-IDF boards. Agent-native."
authors = [{name = "Kevin Ye", email = "kevin.ye32@gmail.com"}]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["esp32", "esp-idf", "cli", "developer-tools", "claude-code", "agentic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Embedded Systems",
]

dependencies = [
  "pyserial>=3.5",
  "requests>=2.31",
  "click>=8.1",
  "pyyaml>=6.0",
  "rich>=13",
  "websockets>=12",
]

[project.scripts]
esp32-devtool = "cli.main:cli"

[project.urls]
Homepage = "https://github.com/dev32-io/esp32-devtool"
Documentation = "https://github.com/dev32-io/esp32-devtool/tree/main/docs"
Issues = "https://github.com/dev32-io/esp32-devtool/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "pip-licenses>=4.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "boards"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "esp32_devtool-NOTICE"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]   # line length handled by formatter
